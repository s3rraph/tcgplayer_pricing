name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write  # create the GitHub Release on tag builds
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Cache Inno Setup
        id: inno-cache
        uses: actions/cache@v4
        with:
          path: C:\Program Files (x86)\Inno Setup 6
          key: innosetup-${{ runner.os }}

      - name: Verify Python has tkinter
        run: python -c "import tkinter; print('tkinter ok')"

      - name: Install Inno Setup
        if: steps.inno-cache.outputs.cache-hit != 'true'
        run: choco install innosetup --no-progress -y

      - name: Stage bundle
        shell: pwsh
        run: ./package.ps1 -PythonDir $env:pythonLocation -Version $env:GITHUB_REF_NAME

      - name: Build installer
        id: iscc
        shell: pwsh
        run: |
          # Manual runs from a branch have no version tag to use.
          $ver = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME -replace '^v','' } else { '0.0.0' }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVer=$ver installer.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed ($LASTEXITCODE)" }
          $ref = $env:GITHUB_REF_NAME -replace '[^A-Za-z0-9._-]', '-'
          $installer = "TCGPriceAdjuster-Setup-$ref-$($env:GITHUB_SHA.Substring(0,7)).exe"
          Rename-Item "Output\TCGPriceAdjuster-Setup.exe" -NewName $installer
          "installer=$installer" >> $env:GITHUB_OUTPUT
          Write-Output "installer: $installer"

      # Manual (non-tag) builds have no release to attach to — a short-lived
      # artifact is the only way to fetch the result.
      - name: Upload installer artifact
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: TCGPriceAdjuster-Setup
          path: Output/${{ steps.iscc.outputs.installer }}
          retention-days: 3

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER: ${{ steps.iscc.outputs.installer }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "Output/${INSTALLER}" \
            --title "${GITHUB_REF_NAME}" --generate-notes
